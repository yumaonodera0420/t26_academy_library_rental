<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common :: meta_header('貸出一覧',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/rental/index.css}" />
</head>
<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">貸出一覧</div>
                <div class="add_btn">
                    <a th:href="@{/rental/add}"></span>貸出登録</span>
                    </a>
                </div>
                <table id="manage_table">
                    <thead>
                        <tr>
                            <th>貸出管理番号</th>
                            <th>書籍名</th>
                            <th>在庫管理番号</th>
                            <th>貸出ステータス</th>
                            <th>貸出情報</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rentalManage : ${rentalManageList}" th:object="${rentalManage}">
                            <td>
                                <div class="manage_item_menu">
                                    <div><a th:href="@{/rental/{id}/edit(id=*{id})}"><img src="../images/icons/edit.png"
                                                alt="edit" /></a></div>
                                    <div th:text="*{id}"></div>
                                </div>
                            </td>
                            <td>
                                <div
                                    th:text="*{stock != null and stock.bookMst != null ? stock.bookMst.title : 'タイトルなし'}">
                                </div>
                            </td>
                            <td>
                                <div th:text="*{stock.id}"></div>
                            </td>
                            <td th:switch="*{status}">
                                <div th:case="0">貸出待ち</div>
                                <div th:case="1">貸出中</div>
                                <div th:case="2">返却済み</div>
                                <div th:case="3">キャンセル</div>
                            </td>
                            <td>
                                <ul>
                                    <li
                                        th:text="${rentalManage.account != null ? '利用者：' + rentalManage.account.name : ''}">
                                    </li>

                                    <li th:if="${rentalManage.rentaledAt != null}"
                                        th:text="${'貸出開始日：' + #temporals.format(rentalManage.rentaledAt, 'yyyy/MM/dd')}">
                                    </li>

                                    <li th:if="${rentalManage.rentaledAt == null}"
                                        th:text="${'貸出予定日：' + #temporals.format(rentalManage.lendDate, 'yyyy/MM/dd')}">
                                    </li>

                                    <li
                                        th:text="${'返却予定日：' + #temporals.format(rentalManage.returnDate, 'yyyy/MM/dd')}">
                                    </li>
                                </ul>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
